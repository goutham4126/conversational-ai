<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voice Assistant | Conversational Experience</title>
    <link rel="stylesheet" href="/static/index.css?v=1.2">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <button id="newChatBtn" class="new-chat-btn">
                    <span class="btn-text">New Session</span>
                </button>
            </div>
            <div id="sessionList" class="session-list">
                <!-- Sessions will be loaded here -->
            </div>
            <!-- <div class="sidebar-footer">
                <div class="user-profile">
                    <div class="avatar">GS</div>
                    <div class="user-info">
                        <span class="user-name">Guest User</span>
                        <span class="user-settings">Settings</span>
                    </div>
                </div>
            </div> -->
        </aside>

        <!-- Main Content -->
        <main class="main-wrapper">


            <header class="header">
                <div class="header-left">
                    <div class="breadcrumb">Voice AI <span class="separator">/</span> <span class="current-page">Session</span></div>
                </div>
                <div class="header-center">
                    <div id="latencyInfo" class="latency-metrics" style="display: none;">
                        <div class="metric-item">
                            <span class="metric-label">NOW</span>
                            <span id="currentLatency" class="metric-value">0ms</span>
                        </div>
                        <div class="metric-item">
                            <span class="metric-label">AVG</span>
                            <span id="avgLatency" class="metric-value">0ms</span>
                        </div>
                    </div>
                </div>
                <div class="header-right">
                    <div class="voice-selector-container">
                        <button id="voiceTrigger" class="voice-trigger" title="Select Assistant Voice">
                            <div class="voice-trigger-content">
                                <span id="activeVoiceName">Zephyr</span>
                            </div>
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                                <path d="m6 9 6 6 6-6"/>
                            </svg>
                        </button>
                        <div id="voiceDropdown" class="voice-dropdown" style="display: none;">
                            <!-- Injected via JavaScript -->
                        </div>
                    </div>
                    <button id="syncBtn" class="sync-action-btn" title="Sync from Cloud" style="display: none;">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 4v6h-6"></path><path d="M1 20v-6h6"></path><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path></svg>
                    </button>
                    <div id="connStatus" class="status-badge">
                        <span class="dot"></span>
                        <span id="connText">Disconnected</span>
                    </div>
                </div>
            </header>

            <div id="transcriptArea" class="transcript-area">
                <div class="welcome-screen">
                    <div class="welcome-orb"></div>
                    <h2>Conversational AI</h2>
                    <p>Click start to begin a real-time voice conversation</p>
                    <div class="feature-pills">
                        <div class="feature-pill">Real-time Audio</div>
                        <div class="feature-pill">Auto Transcription</div>
                        <div class="feature-pill">Cloud Backup</div>
                    </div>
                </div>
                <!-- Transcripts appear here -->
            </div>

            <footer class="controls-container">
                <div class="visualizer-container">
                    <div id="visualizer" class="visualizer"></div>
                </div>
                <button id="micBtn" class="mic-action-btn">
                    <svg id="micIcon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><line x1="12" y1="19" x2="12" y2="23"></line><line x1="8" y1="23" x2="16" y2="23"></line></svg>
                    <span id="statusText">Start Call</span>
                </button>
            </footer>
        </main>
    </div>

    <div id="ratingModal" class="rating-modal" style="display: none;">
        <div class="rating-content">
            <div class="rating-icon">
                <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
                </svg>
            </div>
            <h3>Rate your session</h3>
            <p>How was your experience with the AI voice agent?</p>
            <div class="stars-container" id="starsContainer">
                <span class="star" data-value="1">★</span>
                <span class="star" data-value="2">★</span>
                <span class="star" data-value="3">★</span>
                <span class="star" data-value="4">★</span>
                <span class="star" data-value="5">★</span>
            </div>
            <div class="rating-actions">
                <button id="skipRatingBtn" class="skip-btn">Not now</button>
                <button id="submitRatingBtn" class="submit-btn" disabled>Submit Rating</button>
            </div>

        </div>
    </div>

    <script src="/static/app.js?v=1.2"></script>
</body>
</html>
