<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voice Assistant | Conversational Experience</title>
    <link rel="stylesheet" href="/static/white_ui.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <button id="newChatBtn" class="new-chat-btn">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                    New Session
                </button>
            </div>
            <div id="sessionList" class="session-list">
                <!-- Sessions will be loaded here -->
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-wrapper">
            <header class="header">
                <div id="latencyInfo" class="latency-metrics" style="display: none;">
                    <div class="metric-item">
                        <span class="metric-label">Latency</span>
                        <span id="currentLatency" class="metric-value">0ms</span>
                    </div>
                </div>
                <div class="header-actions">
                    <button id="syncBtn" class="sync-action-btn" title="Sync from Cloud" style="display: none;">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 4v6h-6"></path><path d="M1 20v-6h6"></path><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path></svg>
                    </button>
                    <div id="connStatus" class="status-badge">
                        <span class="dot"></span>
                        <span id="connText">Disconnected</span>
                    </div>
                </div>
            </header>

            <div id="transcriptArea" class="transcript-area">
                <div class="welcome-screen">
                    <div class="welcome-icon">🎙️</div>
                    <h2>Welcome to Gemini Live</h2>
                    <p>Click the button below to start a real-time voice conversation.</p>
                </div>
                <!-- Transcripts appear here -->
            </div>

            <footer class="controls-container">
                <div class="visualizer-container">
                    <div id="visualizer" class="visualizer"></div>
                </div>
                <button id="micBtn" class="mic-action-btn">
                    <svg id="micIcon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><line x1="12" y1="19" x2="12" y2="23"></line><line x1="8" y1="23" x2="16" y2="23"></line></svg>
                    <span id="statusText">Start Support Call</span>
                </button>
            </footer>
        </main>
    </div>

    <script src="/static/app.js"></script>
</body>
</html>
